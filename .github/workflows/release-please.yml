on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

name: release-please

env:
  REGISTRY: ghcr.io/arctiqdynatracedemo/easytrade

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release-please.outputs.releases_created }}
      version: ${{ steps.release-please.outputs.version }}
    steps:
      - id: release-please
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  prepare-build:
    runs-on: ubuntu-24.04
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    outputs:
      images: ${{ steps.retrieve-images.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: retrieve-images
        run: | 
          IMAGES=$(docker compose -f compose.build.yaml config --services | tr '\n' ',' | sed 's/,$//' | jq -c -R 'split(",")')
          echo "images=$IMAGES"
          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"

  build-push-easytrade:
    runs-on: ubuntu-24.04
    needs: [ prepare-build, release-please ]
    strategy:
      matrix:
        image: ${{ fromJSON(needs.prepare-build.outputs.images) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: src/${{ matrix.image }}
          push: true
          tags: | 
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ needs.release-please.outputs.version }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}